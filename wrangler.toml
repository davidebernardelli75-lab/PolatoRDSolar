name = "polatordsolar"
main = "./worker.js"
compatibility_date = "2024-09-04"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*", "!/sw.js", "!/manifest.webmanifest", "!/icon-*", "!/icon.svg", "!/apple-touch-icon.png" ]

[observability]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true
