name: Check vehicle expenses
on:
  pull_request:
    paths:
      - 'src/components/VehicleDashboard.tsx'
      - 'src/lib/vehicle-cost-summary.ts'
      - '.github/workflows/check-vehicle-expenses.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Check changed code against known unrelated baseline errors
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/tsc.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -E 'error TS[0-9]+' /tmp/tsc.log > /tmp/ts-errors.log || true
            if [ ! -s /tmp/ts-errors.log ]; then exit 1; fi
            grep -Ev 'src/components/PlantEditor\.tsx\([0-9]+,[0-9]+\): error TS2345|src/lib/use-equipment-options\.ts\([0-9]+,[0-9]+\): error TS2345' /tmp/ts-errors.log > /tmp/unexpected.log || true
            if [ -s /tmp/unexpected.log ]; then cat /tmp/unexpected.log; exit 1; fi
            echo "::warning::Typecheck has two existing errors in unchanged PlantEditor/use-equipment-options; no new TS errors."
          fi
      - run: npm run build
