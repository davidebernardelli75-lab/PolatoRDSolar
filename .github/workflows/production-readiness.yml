name: Production readiness gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, security and deploy preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Reject tracked environment secrets
        shell: bash
        run: |
          set -euo pipefail

          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "::error::Environment files must not be committed:"
            echo "$tracked_env"
            exit 1
          fi

          leaked="$(git grep -nEI '(sb_secret_[A-Za-z0-9_-]{16,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|eyJhbGciOi[A-Za-z0-9_-]{20,})' -- src public 2>/dev/null || true)"
          if [ -n "$leaked" ]; then
            echo "::error::Potential privileged credential found in browser-delivered source:"
            echo "$leaked"
            exit 1
          fi

      - name: Validate Supabase migration filenames
        shell: bash
        run: |
          set -euo pipefail

          migrations="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -exec basename {} \; | sort)"
          invalid="$(printf '%s\n' "$migrations" | grep -Ev '^[0-9]{14}_[a-z0-9_]+\.sql$' || true)"
          if [ -n "$invalid" ]; then
            echo "::error::Invalid migration filename(s):"
            echo "$invalid"
            exit 1
          fi

          duplicates="$(printf '%s\n' "$migrations" | cut -c1-14 | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate Supabase migration timestamp(s):"
            echo "$duplicates"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck excluding two known main-branch baseline errors
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/tsc.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            grep -E 'error TS[0-9]+' /tmp/tsc.log > /tmp/ts-errors.log || true
            if [ ! -s /tmp/ts-errors.log ]; then
              exit 1
            fi

            grep -Ev 'src/components/PlantEditor\.tsx\([0-9]+,[0-9]+\): error TS2345|src/lib/use-equipment-options\.ts\([0-9]+,[0-9]+\): error TS2345' /tmp/ts-errors.log > /tmp/unexpected.log || true
            if [ -s /tmp/unexpected.log ]; then
              cat /tmp/unexpected.log
              exit 1
            fi

            echo '::warning::Only the two documented pre-existing TypeScript baseline errors remain.'
          fi

      - name: Validate operational scripts syntax
        run: |
          bash -n scripts/polato-backup.sh
          bash -n scripts/polato-verify-production.sh

      - name: Build production bundle
        run: npm run build

      - name: Enforce JavaScript chunk budget
        shell: bash
        run: |
          set -euo pipefail

          oversized="$(find dist/assets -maxdepth 1 -type f -name '*.js' -size +500k -print || true)"
          if [ -n "$oversized" ]; then
            echo "::error::JavaScript chunk budget exceeded (500 kB):"
            while IFS= read -r file; do
              bytes="$(wc -c < "$file" | tr -d ' ')"
              echo "$file — ${bytes} bytes"
            done <<< "$oversized"
            exit 1
          fi

      - name: Test Cloudflare health and security headers
        shell: bash
        run: |
          grep -Fq '"/api/*"' wrangler.toml
          grep -Fq '"/"' wrangler.toml
          grep -Fq '"/*.html"' wrangler.toml

          node --input-type=module <<'EOF'
          const { default: worker } = await import('./worker.js');
          const env = {
            ASSETS: {
              fetch: async () => new Response('<!doctype html>', {
                status: 200,
                headers: { 'content-type': 'text/html' },
              }),
            },
          };

          const assert = (condition, message) => {
            if (!condition) {
              console.error(message);
              process.exit(1);
            }
          };

          const health = await worker.fetch(
            new Request('https://health.test/api/health'),
            env,
          );
          const healthBody = await health.json();

          assert(
            health.status === 200 && healthBody.status === 'ok' && healthBody.assets === 'ok',
            JSON.stringify({ status: health.status, body: healthBody }),
          );

          const page = await worker.fetch(
            new Request('https://health.test/'),
            env,
          );

          const csp = page.headers.get('content-security-policy') || '';
          assert(csp.includes("default-src 'self'"), 'Missing default-src CSP');
          assert(csp.includes("frame-ancestors 'none'"), 'Missing frame-ancestors CSP');
          assert(csp.includes("script-src 'self' 'wasm-unsafe-eval'"), 'WASM CSP not allowed safely');
          assert(!csp.includes("'unsafe-eval'"), 'Unsafe JavaScript eval must remain blocked');
          assert(csp.includes('https://fjmrfxjvqsdrwjucgzla.supabase.co'), 'Supabase HTTPS origin missing from CSP');
          assert(csp.includes('wss://fjmrfxjvqsdrwjucgzla.supabase.co'), 'Supabase Realtime origin missing from CSP');
          assert(page.headers.get('strict-transport-security')?.includes('max-age=31536000'), 'HSTS missing');
          assert(page.headers.get('x-frame-options') === 'DENY', 'X-Frame-Options missing');
          assert(page.headers.get('x-content-type-options') === 'nosniff', 'nosniff missing');
          assert(page.headers.get('referrer-policy') === 'strict-origin-when-cross-origin', 'Referrer-Policy missing');
          assert(page.headers.get('permissions-policy')?.includes('camera=(self)'), 'Camera permission policy missing');
          assert(page.headers.get('access-control-allow-origin') === null, 'Worker must not expose wildcard CORS');

          const crossOrigin = await worker.fetch(
            new Request('https://health.test/api/client-error', {
              method: 'POST',
              headers: {
                origin: 'https://evil.example',
                'sec-fetch-site': 'cross-site',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ kind: 'test', message: 'test' }),
            }),
            env,
          );
          assert(crossOrigin.status === 403, 'Cross-origin API request must be rejected');
          assert(crossOrigin.headers.get('access-control-allow-origin') === null, 'Forbidden response must not enable CORS');

          const sameOrigin = await worker.fetch(
            new Request('https://health.test/api/client-error', {
              method: 'POST',
              headers: {
                origin: 'https://health.test',
                'sec-fetch-site': 'same-origin',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ kind: 'test', message: 'test', path: '/' }),
            }),
            env,
          );
          assert(sameOrigin.status === 204, 'Same-origin client error report must remain available');
          EOF

      - name: Cloudflare deployment dry run
        run: npx --yes wrangler@4.148.0 deploy --dry-run
